services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_router"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: llm-router-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/apps/server
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    # Curated baseline (idempotent): docker compose exec backend python -m packages.infrastructure.db.seeds.seed_models
    command:
      - sh
      - -c
      - |
        sleep 3 &&
        uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  adminer:
    image: adminer
    container_name: llm-router-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
