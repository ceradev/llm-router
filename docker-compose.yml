version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}

      OPENROUTER_AUTO_SYNC_ON_EMPTY_CATALOG: ${OPENROUTER_AUTO_SYNC_ON_EMPTY_CATALOG:-true}
      OPENROUTER_SYNC_ON_STARTUP: ${OPENROUTER_SYNC_ON_STARTUP:-true}
      OPENROUTER_ENABLE_PERIODIC_SYNC: ${OPENROUTER_ENABLE_PERIODIC_SYNC:-true}
      OPENROUTER_SYNC_INTERVAL_HOURS: ${OPENROUTER_SYNC_INTERVAL_HOURS:-6}

      CATALOG_EVALUATION_AFTER_OPENROUTER_SYNC: ${CATALOG_EVALUATION_AFTER_OPENROUTER_SYNC:-true}
      CATALOG_EVALUATION_MAX_MODELS_PER_RUN: ${CATALOG_EVALUATION_MAX_MODELS_PER_RUN:-50}
      CATALOG_EVALUATION_MAX_LIVE_PER_RUN: ${CATALOG_EVALUATION_MAX_LIVE_PER_RUN:-10}
      CATALOG_EVALUATION_PROVIDER_ALLOWLIST: ${CATALOG_EVALUATION_PROVIDER_ALLOWLIST:-}
      CATALOG_EVALUATION_INCLUDE_VERIFIED_LIVE: ${CATALOG_EVALUATION_INCLUDE_VERIFIED_LIVE:-false}
      CATALOG_EVALUATION_LIVE_DELAY_SECONDS: ${CATALOG_EVALUATION_LIVE_DELAY_SECONDS:-2.0}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - internal
      - web

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.llmrouter.es`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: https://api.llmrouter.es
      PUBLIC_ADMIN_API_KEY: ${PUBLIC_ADMIN_API_KEY:-}

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - web

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`llmrouter.es`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=4321"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge

  web:
    external: true
    name: dokploy-network