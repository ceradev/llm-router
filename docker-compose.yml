# Compose general para desarrollo local
# Uso: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: llm-router-backend
    restart: unless-stopped
    working_dir: /app/apps/server
    environment:
      PYTHONPATH: /app:/app/apps/server
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY?OPENROUTER_API_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY?ADMIN_API_KEY is required}
      SYNC_API_KEY: ${SYNC_API_KEY?}
      OPENROUTER_AUTO_SYNC_ON_EMPTY_CATALOG: ${OPENROUTER_AUTO_SYNC_ON_EMPTY_CATALOG:-true}
      OPENROUTER_SYNC_ON_STARTUP: ${OPENROUTER_SYNC_ON_STARTUP:-true}
      OPENROUTER_ENABLE_PERIODIC_SYNC: ${OPENROUTER_ENABLE_PERIODIC_SYNC:-true}
      OPENROUTER_SYNC_INTERVAL_HOURS: ${OPENROUTER_SYNC_INTERVAL_HOURS:-6}
      SEED_MODELS_ON_STARTUP: ${SEED_MODELS_ON_STARTUP:-false}
      CATALOG_EVALUATION_AFTER_OPENROUTER_SYNC: ${CATALOG_EVALUATION_AFTER_OPENROUTER_SYNC:-false}
      CATALOG_EVALUATION_ON_STARTUP: ${CATALOG_EVALUATION_ON_STARTUP:-false}
      CATALOG_EVALUATION_ENABLE_PERIODIC: ${CATALOG_EVALUATION_ENABLE_PERIODIC:-false}
      CATALOG_EVALUATION_INTERVAL_HOURS: ${CATALOG_EVALUATION_INTERVAL_HOURS:-24}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8001}
    container_name: llm-router-frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8001}
      PUBLIC_ADMIN_API_KEY: ${PUBLIC_ADMIN_API_KEY:-}
    ports:
      - "4321:4321"
    depends_on:
      - backend

volumes:
  postgres_data: