# Compose para producción (Coolify/deploy)
# Uso: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: llm-router-backend-prod
    restart: always
    working_dir: /app/apps/server
    environment:
      PYTHONPATH: /app:/app/apps/server
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SYNC_API_KEY: ${SYNC_API_KEY}
      OPENROUTER_AUTO_SYNC_ON_EMPTY_CATALOG: "false"
      OPENROUTER_SYNC_ON_STARTUP: "false"
      OPENROUTER_ENABLE_PERIODIC_SYNC: "true"
      OPENROUTER_SYNC_INTERVAL_HOURS: ${OPENROUTER_SYNC_INTERVAL_HOURS:-6}
      SEED_MODELS_ON_STARTUP: "false"
      CATALOG_EVALUATION_AFTER_OPENROUTER_SYNC: "false"
      CATALOG_EVALUATION_ON_STARTUP: "false"
      CATALOG_EVALUATION_ENABLE_PERIODIC: "false"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: llm-router-frontend-prod
    restart: always
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      PUBLIC_ADMIN_API_KEY: ${PUBLIC_ADMIN_API_KEY:-}
    ports:
      - "4321:4321"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data_prod: